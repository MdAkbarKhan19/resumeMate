<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 440" role="img" aria-label="Modern Two-Column resume template preview">
  <defs>
    <linearGradient id="mtcHeader" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0ecf6"/>
      <stop offset="1" stop-color="#d5e5f0"/>
    </linearGradient>
    <filter id="mtcShadow" x="-2%" y="-1%" width="104%" height="103%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Page -->
  <rect x="10" y="10" width="320" height="420" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#mtcShadow)"/>

  <!-- Header band -->
  <rect x="10" y="10" width="320" height="62" rx="6" fill="url(#mtcHeader)"/>
  <rect x="10" y="60" width="320" height="12" fill="url(#mtcHeader)"/>
  <text x="170" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="300" fill="#1f2937" letter-spacing="2">ALEX MORGAN</text>
  <text x="170" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#4b5563">Senior Software Engineer</text>
  <text x="170" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#4b5563">alex@email.com  |  linkedin.com/in/alex  |  San Francisco</text>

  <!-- Column divider -->
  <line x1="123" y1="84" x2="123" y2="418" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ===== LEFT COLUMN ===== -->
  <g transform="translate(22,88)">
    <!-- Skills -->
    <text x="0" y="9" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#111827">Technical Skills</text>
    <line x1="0" y1="13" x2="92" y2="13" stroke="#3B82F6" stroke-width="1"/>
    <rect x="0" y="20" width="92" height="3" rx="1" fill="#e5e7eb"/>
    <rect x="0" y="27" width="80" height="3" rx="1" fill="#e5e7eb"/>
    <rect x="0" y="34" width="72" height="3" rx="1" fill="#e5e7eb"/>
    <rect x="0" y="41" width="88" height="3" rx="1" fill="#e5e7eb"/>

    <!-- Certifications -->
    <text x="0" y="62" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#111827">Certifications</text>
    <line x1="0" y1="66" x2="92" y2="66" stroke="#3B82F6" stroke-width="1"/>
    <rect x="0" y="72" width="86" height="3" rx="1" fill="#1f2937"/>
    <rect x="0" y="78" width="68" height="2.5" rx="1" fill="#9ca3af"/>
    <rect x="0" y="88" width="84" height="3" rx="1" fill="#1f2937"/>
    <rect x="0" y="94" width="72" height="2.5" rx="1" fill="#9ca3af"/>

    <!-- Education -->
    <text x="0" y="116" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#111827">Education</text>
    <line x1="0" y1="120" x2="92" y2="120" stroke="#3B82F6" stroke-width="1"/>
    <rect x="0" y="127" width="80" height="3.5" rx="1" fill="#1f2937"/>
    <rect x="0" y="134" width="78" height="2.5" rx="1" fill="#9ca3af"/>
    <rect x="0" y="140" width="62" height="2.5" rx="1" fill="#9ca3af"/>

    <!-- Languages -->
    <text x="0" y="164" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#111827">Languages</text>
    <line x1="0" y1="168" x2="92" y2="168" stroke="#3B82F6" stroke-width="1"/>
    <rect x="0" y="175" width="60" height="3" rx="1" fill="#1f2937"/>
    <rect x="0" y="182" width="48" height="3" rx="1" fill="#1f2937"/>
  </g>

  <!-- ===== RIGHT COLUMN ===== -->
  <g transform="translate(135,88)">
    <!-- Summary -->
    <text x="0" y="9" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#111827">Profile Summary</text>
    <line x1="0" y1="13" x2="183" y2="13" stroke="#3B82F6" stroke-width="1"/>
    <rect x="0" y="20" width="183" height="2.5" rx="1" fill="#9ca3af"/>
    <rect x="0" y="26" width="175" height="2.5" rx="1" fill="#9ca3af"/>
    <rect x="0" y="32" width="160" height="2.5" rx="1" fill="#9ca3af"/>

    <!-- Experience -->
    <text x="0" y="56" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#111827">Work Experience</text>
    <line x1="0" y1="60" x2="183" y2="60" stroke="#3B82F6" stroke-width="1"/>

    <!-- Role 1 -->
    <rect x="0" y="68" width="100" height="4" rx="1" fill="#111827"/>
    <rect x="142" y="68.5" width="41" height="3" rx="1" fill="#9ca3af"/>
    <rect x="0" y="76" width="120" height="2.5" rx="1" fill="#6b7280"/>
    <circle cx="3" cy="85" r="1" fill="#9ca3af"/>
    <rect x="8" y="83.5" width="170" height="2.5" rx="1" fill="#9ca3af"/>
    <circle cx="3" cy="92" r="1" fill="#9ca3af"/>
    <rect x="8" y="90.5" width="165" height="2.5" rx="1" fill="#9ca3af"/>
    <circle cx="3" cy="99" r="1" fill="#9ca3af"/>
    <rect x="8" y="97.5" width="158" height="2.5" rx="1" fill="#9ca3af"/>

    <!-- Role 2 -->
    <rect x="0" y="118" width="90" height="4" rx="1" fill="#111827"/>
    <rect x="142" y="118.5" width="41" height="3" rx="1" fill="#9ca3af"/>
    <rect x="0" y="126" width="105" height="2.5" rx="1" fill="#6b7280"/>
    <circle cx="3" cy="135" r="1" fill="#9ca3af"/>
    <rect x="8" y="133.5" width="165" height="2.5" rx="1" fill="#9ca3af"/>
    <circle cx="3" cy="142" r="1" fill="#9ca3af"/>
    <rect x="8" y="140.5" width="170" height="2.5" rx="1" fill="#9ca3af"/>

    <!-- Projects -->
    <text x="0" y="172" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#111827">Projects</text>
    <line x1="0" y1="176" x2="183" y2="176" stroke="#3B82F6" stroke-width="1"/>
    <rect x="0" y="184" width="95" height="4" rx="1" fill="#111827"/>
    <rect x="0" y="192" width="183" height="2.5" rx="1" fill="#9ca3af"/>
    <rect x="0" y="198" width="170" height="2.5" rx="1" fill="#9ca3af"/>
  </g>
</svg>
