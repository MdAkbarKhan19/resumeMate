name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Write SSH key
          echo "$EC2_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          # Sync code (exclude build artifacts and secrets)
          rsync -azP --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env*' \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            ./ ubuntu@$EC2_HOST:/var/www/resumemate/

          # Install and build on server
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@$EC2_HOST << 'EOF'
            set -e
            cd /var/www/resumemate
            npm ci
            npm run build
            pm2 reload resumemate --update-env || pm2 start ecosystem.config.js
            pm2 save
          EOF

          rm /tmp/deploy_key
